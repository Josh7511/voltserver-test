<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LED Blink Simulator</title>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #fff;
        color: #000;
        margin: 0;
        padding: 0 0 60px;
    }

    h1 { margin: 30px 0 0; font-size: 24px; }
    h2 { margin: 0 0 4px; font-size: 19px; }

    .panel {
        border-top: 1px solid #d0d0d0;
        max-width: 700px;
        margin: 0 auto;
        padding: 28px 20px;
    }

    .subtitle {
        color: #444;
        font-size: 13px;
        margin: 2px 0 18px;
    }

    .controls { margin: 14px 0; }

    input[type=number] {
        width: 110px;
        padding: 5px 8px;
        background: #fff;
        color: #000;
        border: 1px solid #bbb;
        border-radius: 4px;
        font-size: 14px;
    }

    select {
        font-size: 14px;
        padding: 6px 10px;
        background: #fff;
        color: #000;
        border: 1px solid #bbb;
        border-radius: 4px;
        cursor: pointer;
    }

    button {
        padding: 8px 20px;
        margin: 5px;
        font-size: 14px;
        background: #f3f3f3;
        color: #000;
        border: 1px solid #bbb;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover { background: #e7e7e7; }

    /* ── Generic blink LED ── */
    #led {
        width: 160px;
        height: 160px;
        margin: 24px auto;
        border-radius: 50%;
        background: #f2f2f2;
        box-shadow: 0 0 8px #cfcfcf;
        border: 2px solid #c8c8c8;
    }

    #freq { font-size: 13px; color: #444; min-height: 1.4em; }

    /* ── Sequence Library LEDs ── */
    .sl-led-row {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin: 20px auto 6px;
    }

    .sl-led-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .sl-led-wrap label {
        font-size: 12px;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .sl-led {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: #f2f2f2;
        border: 2px solid #c8c8c8;
    }

    .sl-led.inactive { opacity: 0.18; }

    .sl-led.on-r {
        background: #ff2200;
        box-shadow: 0 0 22px #ff2200, 0 0 48px #ff2200;
        border-color: #ff5533;
    }
    .sl-led.on-g {
        background: #00dd44;
        box-shadow: 0 0 22px #00dd44, 0 0 48px #00dd44;
        border-color: #33ff66;
    }
    .sl-led.on-b {
        background: #1155ff;
        box-shadow: 0 0 22px #1155ff, 0 0 48px #1155ff;
        border-color: #4477ff;
    }

    /* ── Description / info text ── */
    #sl-desc {
        font-size: 13px;
        color: #444;
        margin: 6px 0 0;
        min-height: 1.4em;
    }

    #sl-select { min-width: 280px; }
</style>
</head>
<body>

<h1>LED Blink Simulator</h1>

<!-- ════════════════════════════════════ -->
<!--           CUSTOM BLINK              -->
<!-- ════════════════════════════════════ -->
<div class="panel">
    <h2>Custom Blink</h2>
    <p class="subtitle">Free-run any color at any cycle and duty cycle</p>

    <div id="led"></div>

    <div class="controls">
        <label>Cycle (ms): </label>
        <input type="number" id="cycle" value="500" min="10">
    </div>
    <div class="controls">
        <label>Duty (%): </label>
        <input type="number" id="duty" value="50" min="1" max="99">
    </div>
    <div class="controls">
        <label>Color: </label>
        <select id="color">
            <option value="red">Red</option>
            <option value="#1155ff">Blue</option>
            <option value="#00dd44">Green</option>
            <option value="yellow">Yellow</option>
            <option value="white">White</option>
        </select>
    </div>
    <div class="controls">
        <button onclick="startBlink()">Start</button>
        <button onclick="stopBlink()">Stop</button>
    </div>
    <p id="freq"></p>
</div>

<!-- ════════════════════════════════════ -->
<!--         SEQUENCE LIBRARY            -->
<!-- ════════════════════════════════════ -->
<div class="panel">
    <h2>Sequence Library</h2>
    <p class="subtitle">All named blink codes from the device spec — exact timings</p>

    <!-- R / G / B LEDs -->
    <div class="sl-led-row">
        <div class="sl-led-wrap">
            <div id="sl-r" class="sl-led"></div>
            <label>R</label>
        </div>
        <div class="sl-led-wrap">
            <div id="sl-g" class="sl-led"></div>
            <label>G</label>
        </div>
        <div class="sl-led-wrap">
            <div id="sl-b" class="sl-led"></div>
            <label>B</label>
        </div>
    </div>

    <!-- Selector -->
    <div class="controls">
        <select id="sl-select" onchange="onSlChange()">
            <optgroup label="Normal States">
                <option value="Init">Init</option>
                <option value="Wait 1">Wait 1</option>
                <option value="Wait 2">Wait 2</option>
                <option value="Wait 3">Wait 3</option>
                <option value="Precharge">Precharge</option>
                <option value="Full On">Full On</option>
                <option value="Software Off">Software Off</option>
                <option value="Live ID">Live ID</option>
            </optgroup>
            <optgroup label="Fault States">
                <option value="Fault Delay">Fault Delay</option>
                <option value="Permanent Fault Load Connection">Permanent Fault — Load Connection</option>
                <option value="Permanent Fault Overload">Permanent Fault — Overload</option>
                <option value="Permanent Fault Transmitter">Permanent Fault — Transmitter</option>
                <option value="Permanent Fault Temperature">Permanent Fault — Temperature</option>
                <option value="Permanent Fault Short Circuit">Permanent Fault — Short Circuit</option>
                <option value="Permanent Fault Internal Failure">Permanent Fault — Internal Failure</option>
            </optgroup>
        </select>
    </div>

    <p id="sl-desc"></p>

    <div class="controls">
        <button onclick="startSeq()">Start</button>
        <button onclick="stopSeq()">Stop</button>
    </div>
</div>

<script>
/* ══════════════════════════════════════════
   CUSTOM BLINK SIMULATOR
══════════════════════════════════════════ */

let blinkId = null;
let blinkOn = false;

function startBlink() {
    stopBlink();
    const cycleMs = parseInt(document.getElementById('cycle').value, 10);
    const duty    = parseInt(document.getElementById('duty').value, 10);
    const color   = document.getElementById('color').value;
    if (cycleMs < 10) return;
    const pct     = Math.max(1, Math.min(99, duty)) / 100;
    const onTime  = Math.round(cycleMs * pct);
    const offTime = cycleMs - onTime;
    document.getElementById('freq').textContent =
        'Rate: ' + (1000 / cycleMs).toFixed(2) + ' Hz  |  ON: ' + onTime + ' ms  OFF: ' + offTime + ' ms';
    const led = document.getElementById('led');
    function blink() {
        if (blinkOn) {
            led.style.background = '#f2f2f2';
            led.style.boxShadow  = '0 0 8px #cfcfcf';
            blinkId = setTimeout(blink, offTime);
        } else {
            led.style.background = color;
            led.style.boxShadow  = '0 0 30px ' + color + ', 0 0 60px ' + color;
            blinkId = setTimeout(blink, onTime);
        }
        blinkOn = !blinkOn;
    }
    blink();
}

function stopBlink() {
    if (blinkId) { clearTimeout(blinkId); blinkId = null; }
    document.getElementById('led').style.background = '#f2f2f2';
    document.getElementById('led').style.boxShadow  = '0 0 8px #cfcfcf';
    blinkOn = false;
}

/* ══════════════════════════════════════════
   SEQUENCE LIBRARY
   All timings in milliseconds.
   Format per channel: [on_1, off_1, on_2, off_2, ...]
   alternating: true → B starts offset by R[0] ms so they interleave
   gap: pause (ms) appended after the sequence ends before looping
══════════════════════════════════════════ */

const SEQUENCES = {
    'Init': {
        R: [], G: [], B: [50,50,50,50,50,50],
        gap: 0,
        desc: 'Blue fast blink · 100 ms cycle @ 50 %'
    },
    'Wait 1': {
        R: [], G: [250,1750,250,1750,250,1750], B: [],
        gap: 0,
        desc: 'Green · 1 pulse per 2 s cycle'
    },
    'Wait 2': {
        R: [], G: [250,250,250,1250,250,250,250,1250], B: [],
        gap: 0,
        desc: 'Green · 2 pulses per 3 s cycle'
    },
    'Wait 3': {
        R: [], G: [250,250,250,250,250,750,250,250,250,250,250,750], B: [],
        gap: 0,
        desc: 'Green · 3 pulses per 3 s cycle'
    },
    'Precharge': {
        R: [], G: [50,50,50,50,50,50], B: [],
        gap: 0,
        desc: 'Green fast blink · 100 ms cycle @ 50 %'
    },
    'Full On': {
        R: [], G: [9000], B: [30,2970,30,2970,30,2970],
        gap: 0,
        desc: 'Green solid · Blue heartbeat — 3 s cycle @ 0.2 %'
    },
    'Software Off': {
        R: [], G: [], B: [30,2970,50,2950,30,2970],
        gap: 0,
        desc: 'Blue heartbeat · 3 s cycle @ 0.2 %'
    },
    'Fault Delay': {
        R: [100,400,100,400,100,400,100,1400], G: [], B: [],
        gap: 0,
        desc: 'Red · 500 ms @ 20 %, with 1 s guard at end'
    },
    'Permanent Fault Load Connection': {
        R: [100,100,100,100], G: [], B: [100,100,100,100],
        alternating: true, gap: 1000,
        desc: 'R/B alternating · 2 blinks per color'
    },
    'Permanent Fault Overload': {
        R: [100,100,100,100,100,100], G: [], B: [100,100,100,100,100,100],
        alternating: true, gap: 1000,
        desc: 'R/B alternating · 3 blinks per color'
    },
    'Permanent Fault Transmitter': {
        R: [100,100,100,100,100,100,100,100], G: [], B: [100,100,100,100,100,100,100,100],
        alternating: true, gap: 1000,
        desc: 'R/B alternating · 4 blinks per color'
    },
    'Permanent Fault Temperature': {
        R: [100,100,100,100,100,100,100,100,100,100], G: [], B: [100,100,100,100,100,100,100,100,100,100],
        alternating: true, gap: 1000,
        desc: 'R/B alternating · 5 blinks per color'
    },
    'Permanent Fault Short Circuit': {
        R: [100,100,100,100,100,100,100,100,100,100,100,100], G: [], B: [100,100,100,100,100,100,100,100,100,100,100,100],
        alternating: true, gap: 1000,
        desc: 'R/B alternating · 6 blinks per color'
    },
    'Permanent Fault Internal Failure': {
        R: [100,100,100,100,100,100,100,100,100,100,100,100,100,100,100,100],
        G: [],
        B: [100,100,100,100,100,100,100,100,100,100,100,100,100,100,100,100],
        alternating: true, gap: 1000,
        desc: 'R/B alternating · 8 blinks per color'
    },
    'Live ID': {
        R: [], G: [], B: [250,750,250,750,250,750,250,750],
        gap: 0,
        desc: 'Blue slow blink · 1 s cycle @ 25 %'
    }
};

const CH_COLOR = { R: '#ff2200', G: '#00dd44', B: '#1155ff' };

let slIds = []; // all active timeout IDs

function setSlLed(ch, on) {
    const el = document.getElementById('sl-' + ch.toLowerCase());
    el.classList.toggle('on-' + ch.toLowerCase(), on);
}

/**
 * Play one channel's timing sequence in a looping recursive timeout chain.
 * idx: position in the timings array (even = on, odd = off)
 * startDelay: initial delay before the first step fires (ms)
 */
function playChannel(ch, timings, gapMs, startDelay) {
    function run(idx) {
        if (idx >= timings.length) {
            setSlLed(ch, false);
            slIds.push(setTimeout(() => run(0), Math.max(0, gapMs)));
            return;
        }
        setSlLed(ch, idx % 2 === 0);
        slIds.push(setTimeout(() => run(idx + 1), timings[idx]));
    }
    slIds.push(setTimeout(() => run(0), startDelay));
}

function stopSeq() {
    slIds.forEach(clearTimeout);
    slIds = [];
    ['R', 'G', 'B'].forEach(ch => setSlLed(ch, false));
}

function startSeq() {
    stopSeq();
    const seq = SEQUENCES[document.getElementById('sl-select').value];

    // Mark which channels are used
    ['R', 'G', 'B'].forEach(ch => {
        document.getElementById('sl-' + ch.toLowerCase())
            .classList.toggle('inactive', seq[ch].length === 0);
    });

    if (seq.R.length) playChannel('R', seq.R, seq.gap, 0);
    if (seq.G.length) playChannel('G', seq.G, seq.gap, 0);
    if (seq.B.length) {
        // Permanent fault: B starts one slot after R (offset = R[0]) so they truly alternate
        const bDelay = seq.alternating ? (seq.R[0] || 0) : 0;
        playChannel('B', seq.B, seq.gap, bDelay);
    }
}

function onSlChange() {
    const name = document.getElementById('sl-select').value;
    document.getElementById('sl-desc').textContent = SEQUENCES[name].desc;
    // Update inactive state without touching playback
    const seq = SEQUENCES[name];
    ['R', 'G', 'B'].forEach(ch => {
        document.getElementById('sl-' + ch.toLowerCase())
            .classList.toggle('inactive', seq[ch].length === 0);
    });
    if (slIds.length) startSeq(); // restart if already playing
}

// Init on load
window.addEventListener('DOMContentLoaded', onSlChange);
</script>

</body>
</html>
